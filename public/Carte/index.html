<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Miss Chawarma – La Carte</title>
<link rel="icon" type="image/png" href="logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --green:#1f6b2d;
    --green-dark:#123f1d;
    --gold:#c47d0e;
    --gold-light:#e2a53f;
    --cream:#f7f0e4;
    --paper:#fffdf8;
    --ink:#1c1712;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(1100px 620px at 15% -10%, rgba(31,107,45,0.10), transparent 60%),
      radial-gradient(900px 560px at 100% 110%, rgba(196,125,14,0.14), transparent 55%),
      var(--cream);
    color:var(--ink);
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding-inline:20px;
    padding-block: max(40px, env(safe-area-inset-top,0px)) max(40px, env(safe-area-inset-bottom,0px));
    font-family:"Work Sans", -apple-system, "Segoe UI", sans-serif;
    position:relative;
    overflow-x:hidden;
  }

  /* subtle cedar-tree watermark behind the card */
  .watermark{
    position:fixed;
    inset:0;
    pointer-events:none;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:0;
  }
  .watermark svg{
    width:min(640px, 140vw);
    height:auto;
    opacity:0.05;
  }

  .stage{ position:relative; z-index:1; width:100%; display:flex; justify-content:center; }

  .card{
    width:100%;
    max-width:440px;
    background: var(--paper);
    border:1px solid rgba(28,23,18,0.08);
    border-radius:26px;
    padding: 34px 30px 30px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.6) inset,
      0 30px 70px -34px rgba(18,63,29,0.45);
    text-align:center;
    animation: rise .6s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .card, .lang-switch, .menu-btn{ animation:none !important; transition:none !important; }
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    margin-bottom:6px;
  }

  .lang-switch{
    display:inline-flex;
    background: var(--cream);
    border:1px solid rgba(28,23,18,0.1);
    border-radius:999px;
    padding:3px;
    gap:2px;
  }
  .lang-switch button{
    appearance:none;
    border:0;
    background:transparent;
    font-family:"Work Sans",sans-serif;
    font-weight:600;
    font-size:11.5px;
    letter-spacing:0.5px;
    padding:6px 12px;
    border-radius:999px;
    color: var(--ink);
    opacity:0.55;
    cursor:pointer;
    transition: background .2s ease, opacity .2s ease, color .2s ease;
  }
  .lang-switch button.active{
    background: var(--green);
    color:#fff;
    opacity:1;
  }
  .lang-switch button:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:6px;
  }
  .brand img{
    width:78px;height:78px;
    object-fit:contain;
    margin-bottom:10px;
    filter: drop-shadow(0 8px 16px rgba(18,63,29,0.25));
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:2.4px;
    text-transform:uppercase;
    color: var(--gold);
    font-weight:600;
    margin:2px 0 8px;
  }

  h1{
    font-family:"Fraunces", Georgia, serif;
    font-weight:600;
    font-optical-sizing:auto;
    font-size:clamp(30px,7.5vw,38px);
    line-height:1.06;
    margin:0 0 12px;
    text-wrap:balance;
    color: var(--green-dark);
  }

  .lede{
    font-size:15px;
    line-height:1.6;
    color:#6b5f4f;
    max-width:32ch;
    margin:0 auto 28px;
  }

  .divider-orn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin: 0 auto 26px;
    color: var(--gold);
  }
  .divider-orn::before, .divider-orn::after{
    content:"";
    height:1px; width:44px;
    background: linear-gradient(90deg, transparent, rgba(196,125,14,0.5));
  }
  .divider-orn::after{ background: linear-gradient(90deg, rgba(196,125,14,0.5), transparent); }
  .divider-orn svg{ width:16px; height:16px; flex:none; }

  .menus{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:24px;
  }

  .menu-btn{
    display:flex;
    align-items:center;
    gap:14px;
    text-align:left;
    padding:15px 18px;
    border-radius:16px;
    text-decoration:none;
    font-family:"Work Sans", sans-serif;
    transition: transform .15s ease, box-shadow .2s ease;
    position:relative;
    overflow:hidden;
  }
  .menu-btn:active{ transform: scale(0.98); }
  .menu-btn:hover{ box-shadow: 0 16px 30px -16px rgba(18,63,29,0.4); }
  .menu-btn:focus-visible{ outline: 2px solid var(--green); outline-offset: 3px; }

  .menu-btn.primary{
    background: linear-gradient(135deg, var(--green) 0%, #4c7a2e 55%, var(--gold-light) 130%);
    color:#fff;
    box-shadow: 0 14px 28px -16px rgba(31,107,45,0.55);
  }
  .menu-btn.secondary{
    background: var(--paper);
    color: var(--ink);
    border:1.5px solid rgba(196,125,14,0.45);
  }
  .menu-btn.secondary:hover{ border-color: var(--gold); }

  .menu-btn .ico{
    flex:none;
    width:40px;height:40px;
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:19px;
    line-height:1;
  }
  .menu-btn.primary .ico{ background: rgba(255,255,255,0.22); color:#fff; }
  .menu-btn.secondary .ico{ background: var(--cream); color: var(--gold); border:1px solid rgba(196,125,14,0.3); }

  .menu-btn .txt{ flex:1; min-width:0; }
  .menu-btn .txt .name{ font-weight:700; font-size:16px; display:block; }
  .menu-btn .txt .sub{ font-size:12px; opacity:0.8; margin-top:2px; display:block; }

  .menu-btn .arrow{ flex:none; font-size:17px; opacity:0.75; transition: transform .15s ease; }
  .menu-btn:hover .arrow{ transform: translate(2px,-2px); }

  .divider{
    height:1px;
    background: linear-gradient(90deg, transparent, rgba(28,23,18,0.14), transparent);
    margin: 20px 0 18px;
  }

  address{
    font-style:normal;
    font-size:12.5px;
    line-height:1.7;
    color:#6b5f4f;
  }
  address strong{
    color: var(--green-dark);
    font-family:"Fraunces", serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.2px;
  }
</style>
</head>
<body>

  <div class="watermark" aria-hidden="true">
    <svg viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 8 L124 56 L108 56 L134 100 L114 100 L142 148 L118 148 L118 212 L82 212 L82 148 L58 148 L86 100 L66 100 L92 56 L76 56 Z" fill="#123f1d"/>
    </svg>
  </div>

  <div class="stage">
    <div class="card">
      <div class="topbar">
        <div class="lang-switch" role="group" aria-label="Langue / Language">
          <button type="button" data-lang-btn="fr" class="active">FR</button>
          <button type="button" data-lang-btn="en">EN</button>
        </div>
      </div>

      <div class="brand">
        <img src="logo.png" alt="Miss Chawarma" />
      </div>

      <p class="eyebrow">Miss Chawarma</p>
      <h1 data-fr="La Carte" data-en="Our Menu">La Carte</h1>
      <p class="lede" data-fr="Cuisine libanaise authentique · Paris 11ᵉ. Consultez ou téléchargez notre carte complète au format PDF." data-en="Authentic Lebanese cuisine · Paris 11th. View or download our full menu as a PDF.">Cuisine libanaise authentique · Paris 11ᵉ. Consultez ou téléchargez notre carte complète au format PDF.</p>

      <div class="divider-orn" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2 L15 9 L13 9 L16.5 15 L14 15 L14 22 L10 22 L10 15 L7.5 15 L11 9 L9 9 Z" fill="#c47d0e"/></svg>
      </div>

      <div class="menus">
        <a class="menu-btn primary" href="menu-fr.pdf" target="_blank" rel="noopener">
          <span class="ico" aria-hidden="true">🇫🇷</span>
          <span class="txt">
            <span class="name">Menu Français</span>
            <span class="sub" data-fr="Carte complète · PDF" data-en="Full menu · PDF">Carte complète · PDF</span>
          </span>
          <span class="arrow">↗</span>
        </a>
        <a class="menu-btn secondary" href="menu-en.pdf" target="_blank" rel="noopener">
          <span class="ico" aria-hidden="true">🇬🇧</span>
          <span class="txt">
            <span class="name">English Menu</span>
            <span class="sub" data-fr="Carte complète · PDF" data-en="Full menu · PDF">Carte complète · PDF</span>
          </span>
          <span class="arrow">↗</span>
        </a>
      </div>

      <div class="divider"></div>

      <address>
        <strong>Miss Chawarma</strong><br>
        128 Rue Oberkampf, 75011 Paris
      </address>
    </div>
  </div>

  <script>
    (function(){
      var STORAGE_KEY = 'mc-carte-lang';
      var buttons = document.querySelectorAll('[data-lang-btn]');
      var texts = document.querySelectorAll('[data-fr][data-en]');

      function apply(lang){
        document.documentElement.lang = lang;
        texts.forEach(function(el){
          el.textContent = el.getAttribute('data-' + lang);
        });
        buttons.forEach(function(btn){
          btn.classList.toggle('active', btn.getAttribute('data-lang-btn') === lang);
        });
        try { localStorage.setItem(STORAGE_KEY, lang); } catch(e) {}
      }

      buttons.forEach(function(btn){
        btn.addEventListener('click', function(){
          apply(btn.getAttribute('data-lang-btn'));
        });
      });

      var initial = 'fr';
      try {
        var saved = localStorage.getItem(STORAGE_KEY);
        if (saved === 'fr' || saved === 'en') initial = saved;
        else if ((navigator.language || '').toLowerCase().indexOf('en') === 0) initial = 'en';
      } catch(e) {
        if ((navigator.language || '').toLowerCase().indexOf('en') === 0) initial = 'en';
      }
      apply(initial);
    })();
  </script>
</body>
</html>
